<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>らくがきランナー</title>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#dfe5ec;overscroll-behavior:none}
@media (prefers-color-scheme:dark){html,body{background:#0f1218}}
body{font-family:"Yomogi","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#c{display:block;margin:0 auto;touch-action:none}
#ov{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#1b2540;cursor:pointer}
#box{max-height:92vh;overflow:auto;background:#fff;border:3px solid #1b2540;border-radius:14px;padding:18px 22px;max-width:320px;box-shadow:4px 5px 0 #1b2540;transform:rotate(-1.5deg)}
@media (prefers-color-scheme:dark){#box{background:#1d2330;color:#e8ecf4;border-color:#e8ecf4;box-shadow:4px 5px 0 #e8ecf4}}
#ov h1{margin:0 0 6px;font-size:30px}
#ov p{margin:4px 0;font-size:16px;line-height:1.5}
#ov .b{margin-top:10px;font-size:20px;font-weight:700;color:#d7263d}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #1b2540;padding:0;cursor:pointer}
.sw.on{outline:3px solid currentColor;outline-offset:2px}
#cc{width:34px;height:30px;padding:0;border:0;background:none;cursor:pointer}
#rk li{margin:1px 0}
.hide{display:none!important}
#pz{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;border:3px solid #1b2540;background:rgba(255,255,255,.85);display:none;gap:5px;align-items:center;justify-content:center;cursor:pointer;padding:0}
#pz i{display:block;width:5px;height:16px;background:#1b2540;border-radius:2px}
@media (prefers-color-scheme:dark){#pz{background:rgba(29,35,48,.85);border-color:#e8ecf4}#pz i{background:#e8ecf4}}
</style>
</head>

  P={x:40,y:420,vx:0,vy:0,r:12};camX=-60;t=0;got=0;ink=INK;drops=[];drGot=0;pn=0;pen=null;segs=[];stars=[];spikes=[];enemies=[];kills=0;airT=0;airTot=0;maxAir=0;usedW=false;usedC=false;inkOut=false;deadBy='';newAch=[];toast=null;
  lastP={x:-200,y:480,w:560};plats=[lastP];gen=lastP.x+lastP.w;grow()
}
function grow(){
  while(gen<camX+W+500){
    const d=Math.max(0,P.x/10),gp=rnd(50,Math.min(220,80+d*.6)),pw=rnd(110,300),y=cl(lastP.y+rnd(-45,45),380,520);
    const p={x:gen+gp,y,w:pw};stars.push({x:gen+gp/2,y:Math.min(lastP.y,y)-50,on:1});
    plats.push(p);gen=p.x+pw;lastP=p;
    if(scav){pn++;if(pn%2==0)drops.push({x:p.x+rnd(20,pw-20),y:p.y-24,on:1,v:65});if(pn%3==1){const sr=stars[stars.length-1];drops.push({x:p.x-gp*(Math.random()<.5?rnd(.2,.38):rnd(.62,.8)),y:sr.y-8,on:1,v:85})}if(pn%4==3)drops.push({x:p.x+rnd(30,pw-30),y:p.y-rnd(90,200),on:1,v:105})}
    if(hard){if(pw>150&&Math.random()<.6)spikes.push({x:p.x+rnd(55,pw-95),y:p.y,w:36});if(Math.random()<.5)enemies.push({x:p.x+rnd(0,pw),y0:rnd(290,430),ph:rnd(0,6),on:1,y:350})}
  }
  plats=plats.filter(p=>p.x+p.w>camX-200);stars=stars.filter(s=>s.x>camX-100);spikes=spikes.filter(s=>s.x>camX-100);drops=drops.filter(d=>d.on&&d.x>camX-100);enemies=enemies.filter(e=>e.on&&e.x>camX-100)
}

async function submit(sc){
  if(!uid||sc<=0)return'err';
  try{
    const res=await fetch(RANK_API+'/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uuid:uid,name:myName||'ななし',score:sc,mode:modeIdx()})});
    const d=await res.json().catch(()=>null);
    if(res.status==429)return'fast';
    if(!res.ok||!d||!d.ok)return d&&d.error=='name not allowed'?'ng':'err';
    fetchRank();
    return d.updated?'new':'no'
  }catch(e){return'err'}
}
async function fetchRank(){
  const md=modeIdx();let timed=false;
  try{
    const ctl=new AbortController();const to=setTimeout(()=>{timed=true;ctl.abort()},10000);
    const res=await fetch(RANK_API+'/ranking?mode='+md+'&uuid='+encodeURIComponent(uid),{signal:ctl.signal});
    clearTimeout(to);
    if(!res.ok)throw 0;
    const d=await res.json();
    if(md!==modeIdx())return;
    rows=d.top||[];rankTotal=d.total||0;myRank=d.myRank;myBest=d.myBest;dbState='ok'
  }catch(e){if(md===modeIdx()&&dbState!='ok')dbState=timed?'slow':'none'}
  renderRank()
}

function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/S+camX,y:(e.clientY-r.top)/S}}
cv.addEventListener('pointerdown',e=>{if(st!='play')return;cv.setPointerCapture(e.pointerId);pen=pos(e)});
cv.addEventListener('pointermove',e=>{
  if(st!='play'||!pen)return;

  // 画面がスクロールしている間も、前回のワールド座標からつなぐ
  const d=Math.hypot(q.x-pen.x,q.y-pen.y);
  if(d<7)return;
  if(d>70){pen=q;return}
  if(ink<d){return}
  ink-=d;segs.push({ax:pen.x,ay:pen.y,bx:q.x,by:q.y,born:t});pen=q;if(isW(INKC))usedW=true;else usedC=true
});

function push(cx,cy,solid){ // circle P vs closest point (cx,cy)
  let dx=P.x-cx,dy=P.y-cy,d=Math.hypot(dx,dy);
  if(d>=P.r)return;if(solid)touch=true;
  let nx,ny;if(d<1e-6){nx=0;ny=-1;d=0}else{nx=dx/d;ny=dy/d}
  P.x+=nx*(P.r-d);P.y+=ny*(P.r-d);
  const vn=P.vx*nx+P.vy*ny;if(vn<0){P.vy-=vn*ny;if(solid)P.vx-=vn*nx*0}
}
function step(dt){
  const sp=cl(115+P.x*.012,115,210);
  P.vx=sp;P.vy=Math.min(P.vy+900*dt,720);
  P.x+=P.vx*dt;P.y+=P.vy*dt;
  for(const p of plats){
    if(p.x>P.x+60||p.x+p.w<P.x-60)continue;
    const cx=cl(P.x,p.x,p.x+p.w),cy=cl(P.y,p.y,p.y+400);
    if(cx===P.x&&cy===P.y){P.y=p.y-P.r;touch=true;if(P.vy>0)P.vy=0}else push(cx,cy,true)
  }
  for(const s of segs){
    if(t-s.born>LIFE)continue;
    const vx=s.bx-s.ax,vy=s.by-s.ay,l2=vx*vx+vy*vy||1;
    const u=cl(((P.x-s.ax)*vx+(P.y-s.ay)*vy)/l2,0,1);
    push(s.ax+vx*u,s.ay+vy*u,false)
  }
  for(const s of stars)if(s.on&&Math.hypot(s.x-P.x,s.y-P.y)<26){s.on=0;got++}
}
function update(dt){
  t+=dt;ink=Math.min(INK,ink+(scav?0:45)*dt);
  const n=3;for(let i=0;i<n;i++){touch=false;step(dt/n);if(touch)airT=0;else{airT+=dt/n;airTot+=dt/n;maxAir=Math.max(maxAir,airT)}}
  const sp=cl(115+P.x*.012,115,210);
  camX=Math.max(camX+sp*dt*.9,P.x-110);
  segs=segs.filter(s=>t-s.born<LIFE+.1&&s.bx>camX-150);
  grow();
  if(hard)hazards(dt);
  if(scav)for(const d of drops)if(d.on&&Math.hypot(d.x-P.x,d.y-P.y)<26){d.on=0;drGot++;ink=Math.min(INK,ink+(d.v||100))}
  if(ink<2)inkOut=true;
  checkAch();
  if(!deadBy&&P.y>H+60)deadBy='fall';if(!deadBy&&P.x<camX+6)deadBy='back';if(deadBy)over()
}
function hazards(dt){
  for(const s of spikes)if(P.x>s.x-5&&P.x<s.x+s.w+5&&P.y+P.r>s.y-15&&P.y<s.y+6)deadBy='spike';
  for(const e of enemies){
    if(!e.on)continue;
    e.x-=50*dt;e.y=e.y0+Math.sin(t*2+e.ph)*28;
    if(Math.hypot(e.x-P.x,e.y-P.y)<P.r+13){deadBy='enemy';continue}
    for(const s of segs){
      if(t-s.born>LIFE)continue;
      const vx=s.bx-s.ax,vy=s.by-s.ay,l2=vx*vx+vy*vy||1,u=cl(((e.x-s.ax)*vx+(e.y-s.ay)*vy)/l2,0,1);
      if(Math.hypot(e.x-s.ax-vx*u,e.y-s.ay-vy*u)<16){e.on=0;kills++;break}
    }
  }
}
function draw(){
  const D=dark(),w=W,C=D?{bg:'#171b24',grid:'#262d3b',pen:'#f08c00',gr:'#2b3445',gl:'#e8ecf4',ink:'#e8ecf4'}:{bg:'#fff',grid:'#cfe0f3',pen:'#f08c00',gr:'#e6e9ee',gl:'#1b2540',ink:'#1b2540'};
  g.fillStyle=C.bg;g.fillRect(0,0,w,H);
  g.strokeStyle=C.grid;g.lineWidth=1;g.beginPath();
  const o=-(camX*.5%32);for(let x=o;x<w;x+=32){g.moveTo(x,0);g.lineTo(x,H)}for(let y=0;y<H;y+=32){g.moveTo(0,y);g.lineTo(w,y)}g.stroke();
  g.save();g.translate(-camX,0);
  for(const p of plats){
    g.fillStyle=C.gr;g.fillRect(p.x,p.y,p.w,H-p.y);
    g.strokeStyle=C.gl;g.lineWidth=3;g.lineCap='round';g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+p.w,p.y);g.moveTo(p.x,p.y);g.lineTo(p.x,H);g.moveTo(p.x+p.w,p.y);g.lineTo(p.x+p.w,H);g.stroke();
    g.lineWidth=1.5;g.beginPath();for(let x=p.x+10;x<p.x+p.w-6;x+=14){g.moveTo(x,p.y+8);g.lineTo(x-8,p.y+20)}g.stroke()
  }
  g.fillStyle='#d7263d';g.strokeStyle=C.ink;g.lineWidth=2;
  for(const s of spikes){g.beginPath();for(let i=0;i<3;i++){const x=s.x+i*12;g.moveTo(x,s.y);g.lineTo(x+6,s.y-15);g.lineTo(x+12,s.y)}g.fill();g.stroke()}
  for(const e of enemies)if(e.on)spr(IMG.e,e.x,e.y,36,true);
  g.font='24px sans-serif';g.textAlign='center';
  for(const d of drops)if(d.on){g.fillStyle=INKC||C.pen;g.strokeStyle=C.ink;g.lineWidth=2.5;g.beginPath();g.moveTo(d.x,d.y-13);g.bezierCurveTo(d.x+12,d.y+2,d.x+10,d.y+12,d.x,d.y+12);g.bezierCurveTo(d.x-10,d.y+12,d.x-12,d.y+2,d.x,d.y-13);g.fill();g.stroke();g.fillStyle='rgba(255,255,255,.75)';g.beginPath();g.arc(d.x-4,d.y+3,2.5,0,7);g.fill();
    if(d.v>65){g.strokeStyle=INKC||C.pen;g.globalAlpha=.5;g.lineWidth=2;g.beginPath();g.arc(d.x,d.y,20+Math.sin(t*5)*2,0,7);g.stroke();g.globalAlpha=1}}
  for(const s of stars)if(s.on)spr(IMG.s,s.x,s.y,30,true);
  g.lineCap='round';g.lineJoin='round';g.lineWidth=6;
  for(const s of segs){const a=cl(LIFE-(t-s.born),0,1);if(a<=0)continue;g.globalAlpha=a;g.beginPath();g.moveTo(s.ax,s.ay);g.lineTo(s.bx,s.by);g.strokeStyle=INKC||C.pen;g.stroke()}
  g.globalAlpha=1;
  // キャラ
  if(!spr(pimg(),P.x,P.y-7,38,true)){g.fillStyle=INKC||'#ffa55f';g.beginPath();g.arc(P.x,P.y,P.r,0,7);g.fill()}
  g.restore();
  // UI
  if(st!='title'){
  g.font='bold 22px Yomogi,sans-serif';g.textAlign='left';g.fillStyle=C.ink;g.fillText(`${score()}点`,14,34);
  g.textAlign='right';g.font='14px Yomogi,sans-serif';g.fillText('インク',w-14,24);
  g.strokeStyle=C.ink;g.lineWidth=2;g.strokeRect(w-134,30,120,12);
  g.fillStyle=ink<50?'#d7263d':(INKC||C.pen);g.fillRect(w-134,30,120*ink/INK,12);
  if(hard){g.textAlign='left';g.font='bold 14px Yomogi,sans-serif';g.fillStyle='#d7263d';g.fillText('HARD',14,54)}
  if(scav){g.textAlign='left';g.font='bold 14px Yomogi,sans-serif';g.fillStyle=C.ink;g.fillText('インク拾い',14,54)}
  if(toast&&t<toast.u){g.textAlign='center';g.font='bold 18px Yomogi,sans-serif';g.fillStyle=C.ink;g.fillText(toast.t,w/2,H-40)}
  }
}
let lt=performance.now(),pzOn=false;
function loop(now){
  const dt=Math.min(.033,(now-lt)/1000);lt=now;
  if(st=='play')update(dt);
  const pv=st=='play';if(pv!==pzOn){pzOn=pv;$('#pz').style.display=pv?'flex':'none'}
  draw();requestAnimationFrame(loop)
}
title();requestAnimationFrame(loop);fetchRank();
</script>
