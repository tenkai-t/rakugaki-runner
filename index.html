<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>らくがきランナー</title>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#dfe5ec;overscroll-behavior:none}
@media (prefers-color-scheme:dark){html,body{background:#0f1218}}
body{font-family:"Yomogi","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#c{display:block;margin:0 auto;touch-action:none}
#ov{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#1b2540;cursor:pointer}
#box{max-height:92vh;overflow:auto;background:#fff;border:3px solid #1b2540;border-radius:14px;padding:18px 22px;max-width:320px;box-shadow:4px 5px 0 #1b2540;transform:rotate(-1.5deg)}
@media (prefers-color-scheme:dark){#box{background:#1d2330;color:#e8ecf4;border-color:#e8ecf4;box-shadow:4px 5px 0 #e8ecf4}}
#ov h1{margin:0 0 6px;font-size:30px}
#ov p{margin:4px 0;font-size:16px;line-height:1.5}
#ov .b{margin-top:10px;font-size:20px;font-weight:700;color:#d7263d}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #1b2540;padding:0;cursor:pointer}
.sw.on{outline:3px solid currentColor;outline-offset:2px}
#cc{width:34px;height:30px;padding:0;border:0;background:none;cursor:pointer}
#rk li{margin:1px 0}
.hide{display:none!important}
#pz{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;border:3px solid #1b2540;background:rgba(255,255,255,.85);display:none;gap:5px;align-items:center;justify-content:center;cursor:pointer;padding:0}
#pz i{display:block;width:5px;height:16px;background:#1b2540;border-radius:2px}
@media (prefers-color-scheme:dark){#pz{background:rgba(29,35,48,.85);border-color:#e8ecf4}#pz i{background:#e8ecf4}}
</style>
</head>

function renderRank(){

async function submit(sc){
  if(!uid||sc<=0)return'err';

    const res=await fetch(RANK_API+'/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uuid:uid,name:myName||'ななし',score:sc,mode:modeIdx()})});
    const d=await res.json().catch(()=>null);
    if(res.status==429)return'fast';
    if(!res.ok||!d||!d.ok)return d&&d.error=='name not allowed'?'ng':'err';
    if(d.name)lockName(d.name);
    fetchRank();
    return d.updated?'new':'no'
  }catch(e){return'err'}
}
async function fetchRank(){
  const md=modeIdx();let timed=false;

    const ctl=new AbortController();const to=setTimeout(()=>{timed=true;ctl.abort()},10000);
    const res=await fetch(RANK_API+'/ranking?mode='+md+'&uuid='+encodeURIComponent(uid),{signal:ctl.signal});
    clearTimeout(to);
    if(!res.ok)throw 0;
    const d=await res.json();
    if(md!==modeIdx())return;
    rows=d.top||[];rankTotal=d.total||0;myRank=d.myRank;myBest=d.myBest;dbState='ok';if(d.myName)lockName(d.myName)

function push(cx,cy,solid){ // circle P vs closest point (cx,cy)
  let dx=P.x-cx,dy=P.y-cy,d=Math.hypot(dx,dy);
  if(d>=P.r)return;if(solid)touch=true;
  let nx,ny;if(d<1e-6){nx=0;ny=-1;d=0}else{nx=dx/d;ny=dy/d}
  P.x+=nx*(P.r-d);P.y+=ny*(P.r-d);
  const vn=P.vx*nx+P.vy*ny;if(vn<0){P.vy-=vn*ny;if(solid)P.vx-=vn*nx*0}
}
function step(dt){
  const sp=cl(115+P.x*.012,115,210);
  P.vx=sp;P.vy=Math.min(P.vy+900*dt,720);
  P.x+=P.vx*dt;P.y+=P.vy*dt;
  for(const p of plats){
    if(p.x>P.x+60||p.x+p.w<P.x-60)continue;
    const cx=cl(P.x,p.x,p.x+p.w),cy=cl(P.y,p.y,p.y+400);
    if(cx===P.x&&cy===P.y){P.y=p.y-P.r;touch=true;if(P.vy>0)P.vy=0}else push(cx,cy,true)
  }
  for(const s of segs){
    if(t-s.born>LIFE)continue;
    const vx=s.bx-s.ax,vy=s.by-s.ay,l2=vx*vx+vy*vy||1;
    const u=cl(((P.x-s.ax)*vx+(P.y-s.ay)*vy)/l2,0,1);
    push(s.ax+vx*u,s.ay+vy*u,false)
  }
  for(const s of stars)if(s.on&&Math.hypot(s.x-P.x,s.y-P.y)<26){s.on=0;got++}
}
function update(dt){
  t+=dt;ink=Math.min(INK,ink+(scav?0:45)*dt);
  const n=3;for(let i=0;i<n;i++){touch=false;step(dt/n);if(touch)airT=0;else{airT+=dt/n;airTot+=dt/n;maxAir=Math.max(maxAir,airT)}}
  const sp=cl(115+P.x*.012,115,210);
  camX=Math.max(camX+sp*dt*.9,P.x-110);
  segs=segs.filter(s=>t-s.born<LIFE+.1&&s.bx>camX-150);
  grow();

  if(scav)for(const d of drops)if(d.on&&Math.hypot(d.x-P.x,d.y-P.y)<26){d.on=0;drGot++;ink=Math.min(INK,ink+(d.v||100))}

}
function hazards(dt){
  for(const s of spikes)if(P.x>s.x-5&&P.x<s.x+s.w+5&&P.y+P.r>s.y-15&&P.y<s.y+6)deadBy='spike';

    e.x-=50*dt;e.y=e.y0+Math.sin(t*2+e.ph)*28;

    for(const s of segs){
      if(t-s.born>LIFE)continue;
      const vx=s.bx-s.ax,vy=s.by-s.ay,l2=vx*vx+vy*vy||1,u=cl(((e.x-s.ax)*vx+(e.y-s.ay)*vy)/l2,0,1);
      if(Math.hypot(e.x-s.ax-vx*u,e.y-s.ay-vy*u)<16){e.on=0;kills++;break}
    }
  }
}

    if(d.v>65){g.strokeStyle=INKC||C.pen;g.globalAlpha=.5;g.lineWidth=2;g.beginPath();g.arc(d.x,d.y,20+Math.sin(t*5)*2,0,7);g.stroke();g.globalAlpha=1}}

  }
}
